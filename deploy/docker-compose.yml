# Production stack. Run from a release directory on the server, with the shared env file:
#   docker compose --env-file /srv/redart/.env -f deploy/docker-compose.yml up -d --build
name: redart

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in /srv/redart/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    logging: *logging

  web:
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    restart: unless-stopped
    environment:
      APP_ORIGIN: https://${DOMAIN}
      INTERNAL_API_URL: http://api:4000
      API_ORIGIN: http://api:4000
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-redart_session}
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

  api:
    build: { context: .., dockerfile: deploy/api.Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: "1"
      APP_ORIGIN: https://${DOMAIN}
      DATABASE_URL: postgresql://${POSTGRES_USER:-redart}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-redart}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-redart_session}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-redart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-redart}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published ports: only the api container can reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
